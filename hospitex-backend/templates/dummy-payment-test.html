<body>
    <div class="container">
        <h1>🏥 HospiTex Dummy Payment Test</h1>
        <p>Test your payment integration without real money!</p>
        
        <div class="form-group">
            <label>Amount (₹)</label>
            <input type="number" id="amount" value="500" step="100">
        </div>
        
        <div class="form-group">
            <label>Payment Status to Simulate</label>
            <select id="paymentStatus">
                <option value="success">✅ Success</option>
                <option value="failed">❌ Failed</option>
            </select>
        </div>
        
        <button onclick="createAndVerifyPayment()">💳 Make Dummy Payment</button>
        <button onclick="getPaymentHistory()">📜 View Payment History</button>
        
        <div id="result" class="result"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        
        // Get token from cookie or localStorage
        const getToken = () => localStorage.getItem('token');
        
        async function createAndVerifyPayment() {
            const amount = document.getElementById('amount').value;
            const paymentStatus = document.getElementById('paymentStatus').value;
            
            showResult('Processing payment...', 'info');
            
            try {
                // Step 1: Create order
                const orderRes = await fetch(${API_URL}/payments/create-order, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': Bearer 
                    },
                    credentials: 'include',
                    body: JSON.stringify({ amount: parseInt(amount) })
                });
                
                const orderData = await orderRes.json();
                if (!orderData.success) throw new Error(orderData.message);
                
                // Step 2: Verify payment
                const verifyRes = await fetch(${API_URL}/payments/verify, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': Bearer 
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        orderId: orderData.data.orderId,
                        paymentStatus: paymentStatus
                    })
                });
                
                const verifyData = await verifyRes.json();
                
                if (verifyData.success) {
                    showResult(✅ Payment !\\nTransaction ID: \\nAmount: ₹, 'success');
                } else {
                    showResult(❌ Payment Failed: , 'error');
                }
            } catch (error) {
                showResult(Error: , 'error');
            }
        }
        
        async function getPaymentHistory() {
            showResult('Loading payment history...', 'info');
            
            try {
                const res = await fetch(${API_URL}/payments/my-payments, {
                    headers: {
                        'Authorization': Bearer 
                    },
                    credentials: 'include'
                });
                
                const data = await res.json();
                if (data.success && data.data.length > 0) {
                    let html = '<h3>📊 Payment History</h3><ul>';
                    data.data.forEach(p => {
                        html += <li>₹ -  -  - TXN: </li>;
                    });
                    html += '</ul>';
                    showResult(html, 'success');
                } else {
                    showResult('No payment history found', 'info');
                }
            } catch (error) {
                showResult(Error: , 'error');
            }
        }

    </script>
